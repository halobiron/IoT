<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dữ liệu cảm biến | Hệ thống Giám sát & Điều khiển IoT</title>
    <link rel="stylesheet" href="../src/styles/main.css?v=filter-time-v7">
    <link rel="stylesheet" href="../src/styles/pages.css?v=filter-time-v7">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body class="history-table-layout">
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>IoT Control</h2>
            </div>

            <nav class="nav-menu">
                <a href="home-page.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Trang chủ</span>
                </a>
                <a href="sensor-data.html" class="nav-item active">
                    <i class="fas fa-chart-line"></i>
                    <span>Dữ liệu cảm biến</span>
                </a>
                <a href="action-history.html" class="nav-item">
                    <i class="fas fa-history"></i>
                    <span>Lịch sử hoạt động</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="sidebar-logout-btn" type="button" data-action="logout">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Đăng xuất</span>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <div class="header-center">
                    <div class="page-title">
                        <h1>Dữ liệu cảm biến</h1>
                    </div>
                </div>
                <div class="header-right">
                    <div class="profile">
                        <div class="avatar" onclick="window.location.href='profile.html'">L</div>
                    </div>
                </div>
            </div>

            <div class="content">
                <div class="data-table-section">
                    <div class="table-card">
                            <div class="table-search-controls">
                                <div class="search-section">
                                    <div class="history-filter-group">
                                        <label class="filter-label" for="searchCriteria">Bộ lọc dữ liệu</label>
                                        <select id="searchCriteria" class="search-criteria-select">
                                            <option value="all">Tất cả</option>
                                            <option value="temperature">Nhiệt độ</option>
                                            <option value="light">Ánh sáng</option>
                                            <option value="humidity">Độ ẩm</option>
                                            <option value="time">Thời gian</option>
                                        </select>
                                    </div>
                                    <div id="sensorValueSearchGroup" class="history-filter-group">
                                        <label id="sensorValueSearchLabel" class="filter-label" for="sensorValueSearchInput">Tìm kiếm giá trị</label>
                                        <div class="search-input-group">
                                            <i class="fas fa-search"></i>
                                            <input type="text" id="sensorValueSearchInput"
                                                placeholder="Tìm kiếm giá trị cảm biến" aria-label="Tìm kiếm giá trị cảm biến">
                                            <input type="text" id="sensorTimeSearchInput" class="date-time-search"
                                                placeholder="Chọn mốc ngày, giờ" aria-label="Chọn mốc thời gian tối đa" readonly hidden>
                                            <button id="clearValueSearch" class="clear-btn" type="button" aria-label="Xóa tìm kiếm giá trị" style="display: none;">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <button id="applySensorFilters" class="filter-submit-btn" type="button">
                                        <i class="fas fa-search"></i>
                                        Tìm kiếm
                                    </button>
                                    <button id="manualRefresh" class="refresh-btn icon-only" type="button" aria-label="Làm mới dữ liệu" title="Làm mới dữ liệu">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </div>
                            </div>

                        <div class="table-container">
                            <div class="table-loading" id="tableLoading" style="display: none;">
                                <div class="loading-spinner"></div>
                                <p>Đang tải dữ liệu...</p>
                            </div>
                            <table id="sensorDataTable" class="sensor-data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tên cảm biến</th>
                                        <th>Giá trị cảm biến</th>
                                        <th>Thời gian cảm biến</th>
                                    </tr>
                                </thead>
                                <tbody id="sensorTableBody">
                                </tbody>
                            </table>
                        </div>
                        <div class="table-pagination" id="tablePagination">
                            <div class="pagination-info">
                                <span id="paginationInfo">Hiển thị 0 - 0 của 0 bản ghi</span>
                            </div>
                            <div class="pagination-controls">
                                <label class="page-size-control" for="tablePageSize">
                                    <input id="tablePageSize" class="page-size-input" type="number" min="1" max="100" step="1" value="10" aria-label="Số dòng mỗi trang" title="Nhập số nguyên từ 1 đến 100">
                                    <span>dòng/trang</span>
                                </label>
                                <button id="prevPage" class="page-btn" disabled>
                                    <i class="fas fa-chevron-left"></i>
                                    Trước
                                </button>
                                <div class="page-numbers" id="pageNumbers">
                                </div>
                                <button id="nextPage" class="page-btn" disabled>
                                    Sau
                                    <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="../src/pages/sensor-data-loader.js?v=filter-time-v7"></script>
    <script src="../src/control/profile-control.js"></script>
    <script src="../src/control/logout-control.js"></script>
</body>

</html>
